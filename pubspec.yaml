name: campus_event_hub
description: >
  Campus Event Hub — verified college event-discovery and event-management platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Media / files
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  device_calendar: ^4.3.0

  # Utilities
  intl: ^0.19.0
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/demo/
